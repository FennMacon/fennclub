    const navColors=new Map(),navTimers=new Map();

    function nextNavColor(key){
      const current=navColors.get(key)??-1;
      const occupied=new Set([...navColors].filter(([other])=>other!==key).map(([,color])=>color));
      for(let step=1;step<=twinkleColors.length;step++){
        const candidate=(current+step)%twinkleColors.length;
        if(!occupied.has(candidate)){navColors.set(key,candidate);return candidate}
      }
      return current; // Keep the existing color if the palette is ever exhausted.
    }
    function setupNavTwinkle(button,key){
      const icon=button.querySelector('span,i');
      if(navColors.has(key))icon.style.color=twinkleColors[navColors.get(key)];
      function start(){
        if(navTimers.has(key))return;
        function paint(){const index=nextNavColor(key);if(index>=0)icon.style.color=twinkleColors[index]}
        paint();if(!matchMedia('(prefers-reduced-motion: reduce)').matches)navTimers.set(key,setInterval(paint,260));
      }
      function stop(){if(!button.matches(':hover')&&document.activeElement!==button)stopNavTwinkle(key)}
      button.addEventListener('mouseenter',start);button.addEventListener('mouseleave',stop);
      button.addEventListener('focus',start);button.addEventListener('blur',stop);
    }

      const playerOrigin=/^https?:$/.test(location.protocol)?location.origin:'https://fenn.club';
      if(item.kind==='bandcamp')return `<div class="media-frame audio-frame"><iframe title="${item.title} on Bandcamp" src="https://bandcamp.com/EmbeddedPlayer/album=${item.bandcampId}/size=large/bgcol=333333/linkcol=e32c14/tracklist=false/transparent=true/" loading="lazy" seamless></iframe></div>`;
      if(youtubeId)return `<div class="media-frame video-frame"><iframe title="${item.title} on YouTube" src="https://www.youtube.com/embed/${youtubeId}?controls=1&playsinline=1&rel=0&origin=${encodeURIComponent(playerOrigin)}" loading="lazy" referrerpolicy="strict-origin-when-cross-origin" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share; fullscreen" allowfullscreen></iframe></div>`;
      if(url.includes('player.vimeo.com'))return `<div class="media-frame video-frame"><iframe title="${item.title}" src="${url}" loading="lazy" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe></div>`;
      if(section.label==='Digital Art'&&/\.(jpg|jpeg|png|gif|webp)(\?|$)/i.test(url))return `<div class="media-frame image-frame"><img src="${url}" alt="${item.title}" loading="lazy"></div>`;
      // These legacy domains need valid HTTPS before browsers can embed them on fenn.club.
      if(section.label==='Web'&&item.previewImage)return `<a class="media-frame image-frame site-preview" href="${url}" target="_blank" rel="noopener" aria-label="Visit ${item.title}"><img src="${item.previewImage}" alt="Screenshot of ${item.title}" loading="lazy"><span>Visit website <i class="fa-solid fa-arrow-up-right-from-square" aria-hidden="true"></i></span></a>`;
      if(section.label==='Web')return `<div class="media-frame site-frame"><iframe title="Preview of ${item.title}" src="${url}" loading="lazy"></iframe></div>`;
      return '';
    }
    function renderGallery(items,section){const item=items.find(x=>x.id===activeLink)||items[0],index=items.indexOf(item);main.innerHTML=`<div class="content-header"><div><p class="eyebrow">${section.label}</p><h2>${item.title}</h2></div><div class="gallery-nav"><span class="content-count">${index+1} / ${items.length}</span><div class="nav-arrows"><button data-prev aria-label="Previous ${section.label} work"><i class="fa-solid fa-arrow-left"></i></button><a class="nav-open" href="${openUrl(item)}" target="_blank" rel="noopener" aria-label="Open ${item.title}" title="Open ${item.title}"><i class="fa-solid fa-arrow-up-right-from-square"></i></a><button data-next aria-label="Next ${section.label} work"><i class="fa-solid fa-arrow-right"></i></button></div></div></div>${renderMedia(item,section)}<div class="item-detail"><p>${item.description}</p>${activeSection==='web'?`<a class="external-link" href="${openUrl(item)}" target="_blank" rel="noopener">Open project <i class="fa-solid fa-arrow-up-right-from-square" aria-hidden="true"></i></a>`:''}</div>`;main.querySelector('[data-prev]')?.addEventListener('click',()=>{navigate(activeSection,items[(index-1+items.length)%items.length].id)});main.querySelector('[data-next]')?.addEventListener('click',()=>{navigate(activeSection,items[(index+1)%items.length].id)})}
    function shortLocation(location){return location.replace('Boston, Massachusetts, United States · On-site','Boston, MA').replace('Boston, Massachusetts, United States','Boston, MA').replace('Boston, Massachusetts','Boston, MA').replace('Burlington, Massachusetts','Burlington, MA')}
    const resumeSubheadings=new Set(['Hybrid Infrastructure, Cloud & Automation Engineering','Security, Compliance & Technical Leadership','Infrastructure & Cloud Administration','Client Support & Service Delivery']);
    function formatResumeBody(body){const parts=body.split('|').filter(Boolean);return parts.length>1?`<ul class="resume-points">${parts.map(point=>resumeSubheadings.has(point)?`<li class="resume-subheading">${point}</li>`:`<li>${point}</li>`).join('')}</ul>`:`<p>${body}</p>`}
    function renderResume(){const id=activeLink,resumeItems=sections.resume.links,resumeIndex=resumeItems.findIndex(item=>item.id===id);let title='',body='',meta='',list=[];if(id==='contact'){title='Contact';list=[{title:'Location',meta:'',body:contact.address},{title:'Phone',meta:'',body:contact.phone,href:'tel:'+contact.phone.replace(/-/g,'')},{title:'Email',meta:'',body:contact.email,href:'mailto:'+contact.email},{title:'LinkedIn',meta:'',body:contact.linkedin,href:contact.linkedin},{title:'Website',meta:'',body:contact.website,href:contact.website}]}else if(id==='profile'){title='Profile';body='Systems engineer working across hybrid infrastructure, cloud operations, identity, and automation. I build internal tools, simplify recurring workflows, and keep enterprise systems reliable. My background spans enterprise IT, data operations, and demand response systems.'}else if(id==='experience'){title='Experience';list=experience.map(x=>({title:x.company,meta:[x.period,shortLocation(x.location)].filter(Boolean).join(' · '),body:x.summary,id:'company-'+x.id}))}else if(id==='education'){title='Education';list=education.map(x=>({title:x.degree,meta:`${x.institution} · ${x.year}`,body:x.details||''}))}else if(id==='skills'){title='Skills';list=skills.map(x=>({title:x[0],meta:'',body:x[1]}))}else if(id==='projects'){title='Projects';list=resumeProjects.map(x=>({title:x.title,meta:x.company,body:x.description}))}else if(id.startsWith('company-')){const company=experience.find(x=>'company-'+x.id===id);title=company.company;meta=[company.period,company.location].filter(Boolean).join(' · ');list=company.roles.map(role=>({title:role.title,meta:role.period,body:role.points.join('|')}))}main.innerHTML=`<div class="content-header"><div><p class="eyebrow">Resume</p><h2>${title}</h2></div><div class="gallery-nav"><span class="content-count">${resumeIndex+1} / ${resumeItems.length}</span><div class="nav-arrows"><button data-resume-prev aria-label="Previous resume item"><i class="fa-solid fa-arrow-left"></i></button><a class="nav-open" href="mailto:${contact.email}" aria-label="Email Fenn" title="Email Fenn"><i class="fa-regular fa-envelope"></i></a><button data-resume-next aria-label="Next resume item"><i class="fa-solid fa-arrow-right"></i></button></div></div></div>${body?`<div class="item-detail"><p>${body}</p></div>`:''}${list.length?`<div class="resume-list ${id==='education'?'education-list':''}">${list.map(x=>`<article class="resume-row"><div><h3>${x.id?`<a href="${routeFor('resume',x.id)}" data-company="${x.id}">${x.title} <i class="fa-solid fa-arrow-right" aria-hidden="true"></i></a>`:x.title}</h3><span>${x.meta}</span></div>${x.href?`<p><a href="${x.href}">${x.body}</a></p>`:x.body?formatResumeBody(x.body):''}</article>`).join('')}</div>`:''}`;main.querySelectorAll('[data-company]').forEach(a=>a.onclick=e=>{e.preventDefault();navigate('resume',a.dataset.company)});main.querySelector('[data-resume-prev]').onclick=()=>{navigate('resume',resumeItems[(resumeIndex-1+resumeItems.length)%resumeItems.length].id)};main.querySelector('[data-resume-next]').onclick=()=>{navigate('resume',resumeItems[(resumeIndex+1)%resumeItems.length].id)}}
    function renderMain(){stopHomeWordTimers();if(activeSection==='home')return renderHome();if(activeSection==='resume')return renderResume();renderGallery(sections[activeSection].links,sections[activeSection])}function render(){document.querySelector('.site-shell').classList.toggle('home-active',activeSection==='home');renderRail();renderContext();renderMain()}document.addEventListener('keydown',event=>{
      if(event.defaultPrevented||event.altKey||event.ctrlKey||event.metaKey||event.shiftKey||!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(event.key))return;
      const target=event.target;
      if(target?.closest?.('input,textarea,select,[contenteditable]:not([contenteditable="false"]),[role="slider"],[role="combobox"],[role="textbox"]'))return;
      if(target?.closest?.('.icon-rail,.context-sidebar,.nav-arrows'))main.focus({preventScroll:true});
      if(['ArrowUp','ArrowDown'].includes(event.key)||activeSection==='home')return;
      const items=sections[activeSection].links,index=items.findIndex(item=>item.id===activeLink),step=event.key==='ArrowRight'?1:-1;
      event.preventDefault();navigate(activeSection,items[(index+step+items.length)%items.length].id);main.focus({preventScroll:true});
    });
    // Horizontal touch gestures follow the same item order as the arrow keys.
    let swipe=null;
    const swipeControls='a,button,input,textarea,select,iframe,video,audio,[contenteditable]:not([contenteditable="false"]),[role="slider"],[role="combobox"]';
    main.addEventListener('pointerdown',event=>{
      if(event.pointerType!=='touch')return;
      swipe=null;
      if(!event.isPrimary||activeSection==='home'||event.target.closest(swipeControls)||event.clientX<20||event.clientX>innerWidth-20)return;
      swipe={pointerId:event.pointerId,x:event.clientX,y:event.clientY,time:event.timeStamp,section:activeSection,item:activeLink};
    });
    main.addEventListener('pointermove',event=>{
      if(!swipe||swipe.pointerId!==event.pointerId)return;
      const dx=Math.abs(event.clientX-swipe.x),dy=Math.abs(event.clientY-swipe.y);
      if(dy>12&&dy>dx)swipe=null;
    });
    main.addEventListener('pointercancel',()=>{swipe=null});
    main.addEventListener('pointerup',event=>{
      if(!swipe||swipe.pointerId!==event.pointerId)return;
      const start=swipe;swipe=null;
      const dx=event.clientX-start.x,dy=event.clientY-start.y;
      if(activeSection!==start.section||activeLink!==start.item||event.timeStamp-start.time>800||Math.abs(dx)<56||Math.abs(dx)<Math.abs(dy)*1.5||window.getSelection()?.toString())return;
      const items=sections[activeSection].links,index=items.findIndex(item=>item.id===activeLink),step=dx<0?1:-1;
      navigate(activeSection,items[(index+step+items.length)%items.length].id);
    });
    window.addEventListener('popstate',readRoute);window.addEventListener('hashchange',readRoute);readRoute();
  </script>
