    const twinkleColors=['#ffffff','#f7c948','#ff7b72','#8bd3dd','#b8a0ff','#ffa657','#7ee787','#ff8fbc','#79b8ff','#d2e884','#e6b8a2','#c4b5fd'];
    const navColors=new Map(),navTimers=new Map();
    function stopNavTwinkle(key){clearInterval(navTimers.get(key));navTimers.delete(key)}
    function nextNavColor(key){
      const current=navColors.get(key)??-1;
      const occupied=new Set([...navColors].filter(([other])=>other!==key).map(([,color])=>color));
      for(let step=1;step<=twinkleColors.length;step++){
        const candidate=(current+step)%twinkleColors.length;
        if(!occupied.has(candidate)){navColors.set(key,candidate);return candidate}
      }
      return current; // Keep the existing color if the palette is ever exhausted.
    }
    function setupNavTwinkle(button,key){
      const icon=button.querySelector('span,i');
      if(navColors.has(key))icon.style.color=twinkleColors[navColors.get(key)];
      function start(){
        if(navTimers.has(key))return;
        function paint(){const index=nextNavColor(key);if(index>=0)icon.style.color=twinkleColors[index]}
        paint();navTimers.set(key,setInterval(paint,260));
      }
      function stop(){if(!button.matches(':hover')&&document.activeElement!==button)stopNavTwinkle(key)}
      button.addEventListener('mouseenter',start);button.addEventListener('mouseleave',stop);
      button.addEventListener('focus',start);button.addEventListener('blur',stop);
    }

    function youtubeVideoId(url){try{const parsed=new URL(url);if(['www.youtube.com','youtube.com','www.youtube-nocookie.com'].includes(parsed.hostname))return parsed.pathname.startsWith('/embed/')?parsed.pathname.split('/')[2]:parsed.searchParams.get('v');if(parsed.hostname==='youtu.be')return parsed.pathname.slice(1)}catch{}return null}
    function openUrl(item){const id=youtubeVideoId(item.url);return id?`https://www.youtube.com/watch?v=${id}`:item.url}
    function renderMedia(item,section){

      if(youtubeId)return `<div class="media-frame video-frame"><iframe title="${item.title} on YouTube" src="https://www.youtube.com/embed/${youtubeId}?controls=1&playsinline=1&rel=0&origin=${encodeURIComponent(playerOrigin)}" loading="lazy" referrerpolicy="strict-origin-when-cross-origin" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share; fullscreen" allowfullscreen></iframe></div>`;
      if(url.includes('player.vimeo.com'))return `<div class="media-frame video-frame"><iframe title="${item.title}" src="${url}" loading="lazy" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe></div>`;

      if(section.label==='Web'&&item.previewImage)return `<a class="media-frame image-frame site-preview" href="${url}" target="_blank" rel="noopener" aria-label="Visit ${item.title}"><img src="${item.previewImage}" alt="Screenshot of ${item.title}" loading="lazy"><span>Visit website <i class="fa-solid fa-arrow-up-right-from-square" aria-hidden="true"></i></span></a>`;

      return '';

    const resumeSubheadings=new Set(['Hybrid Infrastructure, Cloud & Automation Engineering','Security, Compliance & Technical Leadership','Infrastructure & Cloud Administration','Client Support & Service Delivery']);
    function formatResumeBody(body){const parts=body.split('|').filter(Boolean);return parts.length>1?`<ul class="resume-points">${parts.map(point=>resumeSubheadings.has(point)?`<li class="resume-subheading">${point}</li>`:`<li>${point}</li>`).join('')}</ul>`:`<p>${body}</p>`}
    function renderResume(){const id=activeLink,resumeItems=sections.resume.links,resumeIndex=resumeItems.findIndex(item=>item.id===id);let title='',body='',meta='',list=[];if(id==='contact'){title='Contact';list=[{title:'Address',meta:'',body:contact.address},{title:'Phone',meta:'',body:contact.phone},{title:'Email',meta:'',body:contact.email},{title:'LinkedIn',meta:'',body:contact.linkedin},{title:'Website',meta:'',body:contact.website}]}else if(id==='objective'){title='Objective';body='Experienced Systems Engineer with a background in IT support, data engineering, systems administration, DevOps, and the energy sector. Skilled in managing and automating complex cloud environments (Azure, AWS) with infrastructure automation (Python, PowerShell, Terraform, Ansible) and large-scale deployments. Seeking to leverage cloud and operational excellence for impactful results.'}else if(id==='experience'){title='Experience';list=experience.map(x=>({title:x.company,meta:[x.period,x.location].filter(Boolean).join(' · '),body:x.summary,id:'company-'+x.id}))}else if(id==='education'){title='Education';list=education.map(x=>({title:x.degree,meta:`${x.institution} · ${x.year}`,body:[x.details,x.coursework].filter(Boolean).join('|')}))}else if(id==='skills'){title='Skills';list=skills.map(x=>({title:x[0],meta:'',body:x[1]}))}else if(id==='projects'){title='Projects';list=resumeProjects.map(x=>({title:x.title,meta:x.company,body:x.description}))}else if(id.startsWith('company-')){const company=experience.find(x=>'company-'+x.id===id);title=company.company;meta=[company.period,company.location].filter(Boolean).join(' · ');list=company.roles.map(role=>({title:role.title,meta:role.period,body:role.points.join('|')}))}main.innerHTML=`<div class="content-header"><div><p class="eyebrow">Resume</p><h2>${title}</h2></div><div class="gallery-nav"><span class="content-count">${resumeIndex+1} / ${resumeItems.length}</span><div class="nav-arrows"><button data-resume-prev aria-label="Previous resume item"><i class="fa-solid fa-arrow-left"></i></button><a class="nav-open" href="mailto:${contact.email}" aria-label="Email Fenn" title="Email Fenn"><i class="fa-regular fa-envelope"></i></a><button data-resume-next aria-label="Next resume item"><i class="fa-solid fa-arrow-right"></i></button></div></div></div>${body?`<div class="item-detail"><p>${body}</p></div>`:''}${list.length?`<div class="resume-list">${list.map(x=>`<article class="resume-row"><div><h3>${x.title}</h3><span>${x.meta}</span></div>${formatResumeBody(x.body)}</article>`).join('')}</div>`:''}`;main.querySelector('[data-resume-prev]').onclick=()=>{activeLink=resumeItems[(resumeIndex-1+resumeItems.length)%resumeItems.length].id;renderContext();renderMain()};main.querySelector('[data-resume-next]').onclick=()=>{activeLink=resumeItems[(resumeIndex+1)%resumeItems.length].id;renderContext();renderMain()}}
    function renderMain(){if(activeSection==='home')return renderHome();if(activeSection==='resume')return renderResume();renderGallery(sections[activeSection].links,sections[activeSection])}function render(){document.querySelector('.site-shell').classList.toggle('home-active',activeSection==='home');renderRail();renderContext();renderMain()}const sectionOrder=['home','music','web','digital','resume'];document.addEventListener('keydown',event=>{if(['INPUT','TEXTAREA'].includes(document.activeElement?.tagName))return;if(['ArrowLeft','ArrowRight'].includes(event.key)&&['music','web','digital','resume'].includes(activeSection)){event.preventDefault();const items=sections[activeSection].links,index=items.findIndex(item=>item.id===activeLink),step=event.key==='ArrowRight'?1:-1;activeLink=items[(index+step+items.length)%items.length].id;renderContext();renderMain()}else if(['ArrowUp','ArrowDown'].includes(event.key)){event.preventDefault();const index=sectionOrder.indexOf(activeSection),step=event.key==='ArrowDown'?1:-1;activeSection=sectionOrder[(index+step+sectionOrder.length)%sectionOrder.length];activeLink=sections[activeSection].links[0].id;render()}});render();
  </script>
</body></html>
