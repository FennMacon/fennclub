<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="100%" height="300px" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <title>Guitar Fretboard</title>
  
  <!-- Background -->
  <rect x="0" y="0" width="1200" height="300" fill="#f9e4c0" />
  
  <!-- Frets -->
  <line x1="100" y1="0" x2="100" y2="300" stroke="black" stroke-width="5" />
  <line x1="200" y1="0" x2="200" y2="300" stroke="black" stroke-width="3" />
  <line x1="300" y1="0" x2="300" y2="300" stroke="black" stroke-width="3" />
  <line x1="400" y1="0" x2="400" y2="300" stroke="black" stroke-width="3" />
  <line x1="500" y1="0" x2="500" y2="300" stroke="black" stroke-width="3" />
  <line x1="600" y1="0" x2="600" y2="300" stroke="black" stroke-width="5" />
  <line x1="700" y1="0" x2="700" y2="300" stroke="black" stroke-width="3" />
  <line x1="800" y1="0" x2="800" y2="300" stroke="black" stroke-width="3" />
  <line x1="900" y1="0" x2="900" y2="300" stroke="black" stroke-width="3" />
  <line x1="1000" y1="0" x2="1000" y2="300" stroke="black" stroke-width="3" />
  <line x1="1100" y1="0" x2="1100" y2="300" stroke="black" stroke-width="5" />
  <line x1="1200" y1="0" x2="1200" y2="300" stroke="black" stroke-width="3" />
  
  <!-- Fret Markers (dots) -->
  <circle cx="250" cy="150" r="10" fill="#555" />
  <circle cx="450" cy="150" r="10" fill="#555" />
  <circle cx="650" cy="150" r="10" fill="#555" />
  <circle cx="850" cy="150" r="10" fill="#555" />
  <circle cx="1050" cy="150" r="10" fill="#555" />
  
  <!-- Strings -->
  <line x1="0" y1="25" x2="1200" y2="25" stroke="#D9D9D9" stroke-width="2" />
  <line x1="0" y1="75" x2="1200" y2="75" stroke="#B8B8B8" stroke-width="3" />
  <line x1="0" y1="125" x2="1200" y2="125" stroke="#989898" stroke-width="4" />
  <line x1="0" y1="175" x2="1200" y2="175" stroke="#787878" stroke-width="5" />
  <line x1="0" y1="225" x2="1200" y2="225" stroke="#585858" stroke-width="6" />
  <line x1="0" y1="275" x2="1200" y2="275" stroke="#383838" stroke-width="7" />
  
  <!-- Fret Numbers -->
  <text x="50" y="290" font-family="Arial" font-size="14" text-anchor="middle">0</text>
  <text x="150" y="290" font-family="Arial" font-size="14" text-anchor="middle">1</text>
  <text x="250" y="290" font-family="Arial" font-size="14" text-anchor="middle">2</text>
  <text x="350" y="290" font-family="Arial" font-size="14" text-anchor="middle">3</text>
  <text x="450" y="290" font-family="Arial" font-size="14" text-anchor="middle">4</text>
  <text x="550" y="290" font-family="Arial" font-size="14" text-anchor="middle">5</text>
  <text x="650" y="290" font-family="Arial" font-size="14" text-anchor="middle">6</text>
  <text x="750" y="290" font-family="Arial" font-size="14" text-anchor="middle">7</text>
  <text x="850" y="290" font-family="Arial" font-size="14" text-anchor="middle">8</text>
  <text x="950" y="290" font-family="Arial" font-size="14" text-anchor="middle">9</text>
  <text x="1050" y="290" font-family="Arial" font-size="14" text-anchor="middle">10</text>
  <text x="1150" y="290" font-family="Arial" font-size="14" text-anchor="middle">11</text>
  <text x="1150" y="290" font-family="Arial" font-size="14" text-anchor="middle">12</text>
  
  <!-- String Names -->
  <text x="10" y="30" font-family="Arial" font-size="14" text-anchor="middle">E</text>
  <text x="10" y="80" font-family="Arial" font-size="14" text-anchor="middle">B</text>
  <text x="10" y="130" font-family="Arial" font-size="14" text-anchor="middle">G</text>
  <text x="10" y="180" font-family="Arial" font-size="14" text-anchor="middle">D</text>
  <text x="10" y="230" font-family="Arial" font-size="14" text-anchor="middle">A</text>
  <text x="10" y="280" font-family="Arial" font-size="14" text-anchor="middle">E</text>
</svg> 