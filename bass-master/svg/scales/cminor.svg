<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="100%" height="300px" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <!-- C Minor Scale: C, D, Eb, F, G, Ab, Bb -->
  
