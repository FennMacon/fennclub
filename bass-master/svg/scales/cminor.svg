    <!-- String 1 (E) - Positions for F, G, Ab, Bb, C, D, Eb -->
    <circle cx="100" cy="205" r="15" fill="rgba(0, 128, 0, 0.5)" /> <!-- F -->
    <circle cx="200" cy="205" r="15" fill="rgba(0, 0, 255, 0.5)" /> <!-- G -->
    <circle cx="250" cy="205" r="15" fill="rgba(75, 0, 130, 0.5)" /> <!-- Ab -->
    <circle cx="350" cy="205" r="15" fill="rgba(143, 0, 255, 0.5)" /> <!-- Bb -->
    <circle cx="450" cy="205" r="15" fill="rgba(255, 0, 0, 0.5)" /> <!-- C -->
    <circle cx="550" cy="205" r="15" fill="rgba(255, 165, 0, 0.5)" /> <!-- D -->
    <circle cx="600" cy="205" r="15" fill="rgba(255, 255, 0, 0.5)" /> <!-- Eb -->
    
    <!-- String 2 (A) - Positions for Bb, C, D, Eb, F, G, Ab -->
    <circle cx="100" cy="175" r="15" fill="rgba(143, 0, 255, 0.5)" /> <!-- Bb -->
    <circle cx="200" cy="175" r="15" fill="rgba(255, 0, 0, 0.5)" /> <!-- C -->
    <circle cx="300" cy="175" r="15" fill="rgba(255, 165, 0, 0.5)" /> <!-- D -->
