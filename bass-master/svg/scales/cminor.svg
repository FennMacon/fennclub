    <circle cx="150" cy="145" r="15" fill="rgba(0, 128, 0, 0.5)" /> <!-- F -->
    <circle cx="250" cy="145" r="15" fill="rgba(0, 0, 255, 0.5)" /> <!-- G -->
    <circle cx="300" cy="145" r="15" fill="rgba(75, 0, 130, 0.5)" /> <!-- Ab -->
    <circle cx="400" cy="145" r="15" fill="rgba(143, 0, 255, 0.5)" /> <!-- Bb -->
    <circle cx="500" cy="145" r="15" fill="rgba(255, 0, 0, 0.5)" /> <!-- C -->
    
    <!-- String 4 (G) - Positions for Ab, Bb, C, D, Eb, F -->
