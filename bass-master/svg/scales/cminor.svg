    <circle cx="150" cy="115" r="15" fill="rgba(143, 0, 255, 0.5)" /> <!-- Bb -->
    <circle cx="250" cy="115" r="15" fill="rgba(255, 0, 0, 0.5)" /> <!-- C -->
    <circle cx="350" cy="115" r="15" fill="rgba(255, 165, 0, 0.5)" /> <!-- D -->
    <circle cx="400" cy="115" r="15" fill="rgba(255, 255, 0, 0.5)" /> <!-- Eb -->
    <circle cx="500" cy="115" r="15" fill="rgba(0, 128, 0, 0.5)" /> <!-- F -->
