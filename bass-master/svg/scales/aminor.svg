<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="100%" height="300px" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <!-- A Minor Scale: A, B, C, D, E, F, G -->
  
  <!-- Piano Overlay -->
  <g class="piano-highlights">
    <!-- A keys -->
    <rect x="150" y="0" width="30" height="180" fill="rgba(75, 0, 130, 0.3)" />
    <rect x="360" y="0" width="30" height="180" fill="rgba(75, 0, 130, 0.3)" />
    <rect x="570" y="0" width="30" height="180" fill="rgba(75, 0, 130, 0.3)" />
    <rect x="780" y="0" width="30" height="180" fill="rgba(75, 0, 130, 0.3)" />
    <rect x="990" y="0" width="30" height="180" fill="rgba(75, 0, 130, 0.3)" />
    
    <!-- B keys -->
    <rect x="180" y="0" width="30" height="180" fill="rgba(143, 0, 255, 0.3)" />
    <rect x="390" y="0" width="30" height="180" fill="rgba(143, 0, 255, 0.3)" />
    <rect x="600" y="0" width="30" height="180" fill="rgba(143, 0, 255, 0.3)" />
