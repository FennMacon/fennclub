    <rect x="480" y="0" width="30" height="180" fill="rgba(255, 255, 0, 0.3)" />
    <rect x="690" y="0" width="30" height="180" fill="rgba(255, 255, 0, 0.3)" />
    <rect x="900" y="0" width="30" height="180" fill="rgba(255, 255, 0, 0.3)" />
    <rect x="1110" y="0" width="30" height="180" fill="rgba(255, 255, 0, 0.3)" />
    
    <!-- F keys -->
    <rect x="90" y="0" width="30" height="180" fill="rgba(0, 128, 0, 0.3)" />
