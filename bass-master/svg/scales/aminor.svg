    <!-- G keys -->
    <rect x="120" y="0" width="30" height="180" fill="rgba(0, 0, 255, 0.3)" />
    <rect x="330" y="0" width="30" height="180" fill="rgba(0, 0, 255, 0.3)" />
    <rect x="540" y="0" width="30" height="180" fill="rgba(0, 0, 255, 0.3)" />
