<script type="module">
import * as THREE from 'three';
import {buildWorld} from '../world-runtime.js';
import {SCENE_CONFIGS} from '../scenes.js';
import {loadAllContent} from '../content-loader.js';
import {updateNightSky} from '../nightsky.js';
import {updateSkybox} from '../skybox.js';
import {updateZoneFog,updateGroundFog} from '../fog.js';
import {animateClouds} from '../animation.js';
import {initializeRenderer,initializePostProcessing,renderScene,handleResize} from '../renderer.js';
await loadAllContent();
const camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.1,1000),scene=new THREE.Scene();
const world=buildWorld(scene,camera,'PLAZA',SCENE_CONFIGS.PLAZA,'suburban');
initializeRenderer();const {postMaterial}=initializePostProcessing();
postMaterial.uniforms.suburbanAtmosphere.value=true;
const area=document.querySelector('#area'),phase=document.querySelector('#phase'),clock=document.querySelector('#clock'),view=document.querySelector('#view'),play=document.querySelector('#play');
phase.onchange=()=>{clock.value=phase.value;};
const positions={plaza:[80,11],pond:[90,-322],forest:[65,344],mansion:[260,344]};
let previous=performance.now();
const frame=now=>{
    const delta=Math.min(.05,(now-previous)/1000);previous=now;
    if(play.checked)clock.value=(Number(clock.value)+delta/30)%1;
    const progress=Number(clock.value),[x,z]=positions[area.value];
    camera.position.set(x,2.5,z+8);
    updateZoneFog(scene,camera,world,false,progress);updateSkybox(scene);updateNightSky(scene,now/1000,progress,camera);
    const target=scene.userData.nightSky[scene.userData.atmosphere.sun.y>0?'sun':'moon'].position;
    if(view.value==='sky')camera.lookAt(target);
    else camera.lookAt(x+(view.value==='west'?-100:100),view.value==='street'?2.5:18,z+8);
    world.unifiedMapTrees.update(camera);animateClouds(world,camera,scene);updateGroundFog(scene);
    postMaterial.uniforms.atmosphereExposure.value=scene.userData.atmosphere.exposure;
    renderScene(scene,camera);
    const hours=progress*24;
    document.querySelector('#status').textContent=`${String(Math.floor(hours)).padStart(2,'0')}:${String(Math.floor(hours%1*60)).padStart(2,'0')} · haze ${scene.fog.near.toFixed(0)}–${scene.fog.far.toFixed(0)} · east +X / west −X`;
    requestAnimationFrame(frame);
};
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();handleResize();});
requestAnimationFrame(frame);
</script></body></html>
