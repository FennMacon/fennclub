<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Allston city districts</title><style>body{margin:0;font:14px Arial;background:#77817d;color:#f3ead7}canvas{display:block}header{position:absolute;top:16px;left:16px;max-width:88vw;padding:14px;background:#263b35e8;border:1px solid #a1ac98}select,button{min-height:40px;background:#364d43;color:#fff;border:1px solid #a1ac98;margin-top:8px;padding:6px}small{display:block;margin-top:8px;max-width:320px;line-height:1.5}</style></head><body><header><b>ALLSTON · NINE NEIGHBORHOODS</b><br><select aria-label="City district"></select><button id="fog">Map overview</button><div><button id="walk">Step forward</button><button id="back">Step back</button><button id="left">Turn left</button><button id="right">Turn right</button><button id="sign">Sign detail</button></div><small id="description"></small></header><script type="importmap">{"imports":{"three":"../vendor/three/three.module.js","three/addons/":"../vendor/three/addons/"}}</script><script type="module">
import * as THREE from 'three';
import {buildWorld} from '../world-runtime.js';
import {CITY_DISTRICTS,CITY_ATMOSPHERE} from '../world/city-layout.js';
import {SCENE_CONFIGS} from '../scenes.js';
import {loadAllContent} from '../content-loader.js';
await loadAllContent();
const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,1800),scene=new THREE.Scene();
const world=buildWorld(scene,camera,'CITY_PLAZA',SCENE_CONFIGS.CITY_PLAZA,'city');
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(1);document.body.append(renderer.domElement);
const select=document.querySelector('select');CITY_DISTRICTS.forEach((d,i)=>{const option=document.createElement('option');option.value=i;option.textContent=`${i+1} · ${d.name}`;select.append(option);});
const views=[[-350,2.5,346,-270,4,346],[10,3,356,0,3,325],[330,3,353,350,6,392],[-350,2.5,13,-270,4,13],[10,3,24,0,3,-7],[330,2.5,112,410,4,112],[-344,2.5,-346,-344,2,-385],[10,3,-308,0,3,-340],[333,2.5,-278,333,2,-302]];
let overview=false;
const render=()=>{const d=CITY_DISTRICTS[select.value];document.getElementById('description').textContent=d.name+' · '+world.cityDistricts.plan.lots.filter(l=>l.district===d.key).length+' planned buildings';if(overview){camera.position.set(700,1000,900);camera.lookAt(0,0,0);scene.fog=null;world.cityDistricts.group.traverse(o=>{if(o.name.startsWith('CityBlock:'))o.visible=true;});}else{const v=views[select.value];camera.position.set(...v.slice(0,3));camera.lookAt(...v.slice(3));scene.fog=new THREE.Fog(CITY_ATMOSPHERE.color,CITY_ATMOSPHERE.near,CITY_ATMOSPHERE.far);world.cityDistricts.update(camera);}renderer.render(scene,camera);};
const paint=()=>{world.cityDistricts.update(camera);renderer.render(scene,camera);};
const walk=distance=>{if(overview){overview=false;render();}camera.translateZ(distance);camera.position.y=2.5;paint();};
document.getElementById('walk').onclick=()=>walk(-5);document.getElementById('back').onclick=()=>walk(5);
for(const [id,angle] of [['left',.18],['right',-.18]])document.getElementById(id).onclick=()=>{if(overview){overview=false;render();}camera.rotateY(angle);paint();};
document.getElementById('sign').onclick=()=>{overview=false;const lot=world.cityDistricts.plan.lots.find(l=>l.district===CITY_DISTRICTS[select.value].key&&l.retail);const front=lot.z+lot.facing*lot.depth/2;const sign=world.cityDistricts.group.children.find(o=>o.name==='AbstractStoreSign:'+lot.name&&Math.abs(o.position.x-lot.x)<.1&&Math.abs(o.position.z-front)<3);const normal=new THREE.Vector3(0,0,1).applyQuaternion(sign.quaternion);camera.position.copy(sign.position).addScaledVector(normal,14);camera.position.y=2.5;camera.lookAt(sign.position);scene.fog=new THREE.Fog(CITY_ATMOSPHERE.color,CITY_ATMOSPHERE.near,CITY_ATMOSPHERE.far);paint();};
renderer.domElement.tabIndex=0;renderer.domElement.setAttribute('aria-label','Walk around city preview');
renderer.domElement.addEventListener('keydown',event=>{if(['w','s','a','d','ArrowLeft','ArrowRight'].includes(event.key)){event.preventDefault();if(event.key==='w')walk(-3);else if(event.key==='s')walk(3);else if(event.key==='a'||event.key==='d'){camera.translateX(event.key==='a'?-3:3);paint();}else{camera.rotateY(event.key==='ArrowLeft'?.12:-.12);paint();}}});
select.addEventListener('change',()=>{overview=false;render();});document.getElementById('fog').onclick=()=>{overview=!overview;render();};render();
</script></body></html>
