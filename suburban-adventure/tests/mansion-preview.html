<!doctype html><html><head><meta charset="utf-8"><title>Mansion woodland approach</title><style>body{margin:0;background:#101a20;color:#fff;font:16px Arial}header{position:absolute;top:20px;left:24px}canvas{display:block}</style></head><body><header>Mansion · winding woodland approach</header><script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script><script type="module">
import * as THREE from 'three';
import { createMansionCompound } from '../world/landmarks.js';
import { MANSION_CONFIG, getMansionPathSamples } from '../world/config.js';
import { createTree } from '../utils.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x101a20);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);document.body.append(renderer.domElement);
const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.1,1000);camera.position.set(330,210,215);camera.lookAt(350,0,410);
scene.add(new THREE.AmbientLight(0xffffff,2));
const ground=new THREE.Mesh(new THREE.PlaneGeometry(300,180),new THREE.MeshBasicMaterial({color:0x283d2d}));ground.rotation.x=-Math.PI/2;ground.position.set(350,-.25,410);scene.add(ground);
const road=new THREE.Mesh(new THREE.PlaneGeometry(300,22),new THREE.MeshBasicMaterial({color:0x34383b}));road.rotation.x=-Math.PI/2;road.position.set(350,.01,344);scene.add(road);
createMansionCompound(scene);
const samples=getMansionPathSamples(),m=MANSION_CONFIG;
for(let x=218;x<492;x+=13)for(let z=363;z<493;z+=13){const px=x+3*Math.sin(x+z),pz=z+3*Math.cos(x-z);if(Math.abs(px-m.x)<m.width/2&&Math.abs(pz-m.z)<m.depth/2)continue;if(samples.some(p=>Math.hypot(px-p.x,pz-p.z)<6))continue;scene.add(createTree(px,pz,.7));}
renderer.render(scene,camera);
</script></body></html>
